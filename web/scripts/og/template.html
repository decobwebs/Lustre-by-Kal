<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;600;700&display=block">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#fcfbf8;color:#231c15;font-family:"Source Sans 3",sans-serif;display:grid;grid-template-columns:1fr 470px;grid-template-rows:630px}
  .left{padding:64px 40px 60px 72px;display:flex;flex-direction:column;min-height:0}
  .logo{color:#866033;width:250px}
  .logo svg{width:100%;height:auto;display:block}
  .eyebrow{margin-top:auto;font-weight:700;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#7a5629}
  h1{font-family:Marcellus,serif;font-weight:400;font-size:{{TITLE_SIZE}}px;line-height:1.02;margin-top:14px}
  .meta{margin-top:22px;font-size:28px;color:#6b6053}
  .meta b{color:#7a5629}
  .right{background:#e5ddd0;display:grid;grid-template-columns:234px 234px;grid-template-rows:380px 248px;gap:2px;height:630px}
  .ph{background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0;min-height:0}
  .ph img{display:block;max-width:78%;max-height:78%;width:auto;height:auto;object-fit:contain}
  .ph.big{grid-column:1 / 3}
  .ph.big img{max-width:86%;max-height:86%}
</style>
</head>
<body>
  <div class="left">
    <div class="logo">{{LOGO}}</div>
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{META}}</p>
  </div>
  <div class="right">
    <div class="ph big"><img src="{{IMG1}}"></div>
    <div class="ph"><img src="{{IMG2}}"></div>
    <div class="ph"><img src="{{IMG3}}"></div>
  </div>
</body>
</html>
